
name: Build RansomDemoAndroid APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -o RansomDemoAndroid_source.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Check Android project
        run: |
          if find project -name gradlew -type f | grep -q .; then
            echo "Gradle wrapper encontrado"
          else
            echo "Falta el wrapper de Gradle; hay que revisar el proyecto"
            exit 1
          fi
